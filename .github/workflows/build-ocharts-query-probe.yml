name: Build GEM o-charts Query Probe
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout GEM probe
        uses: actions/checkout@v4
        with:
          path: gem

      - name: Checkout o-charts source
        shell: cmd
        run: |
          git clone https://github.com/deeprey-marine/deeprey-ocharts.git ocharts
          cd ocharts
          git submodule update --init opencpn-libs

      - name: Apply GEM selected-object probe
        shell: powershell
        run: python gem\tools\patch_ocharts.py

      - name: Install Gettext
        shell: powershell
        run: |
          choco install gettext -y
          $gettextBin = "C:\Program Files\gettext-iconv\bin"
          if (-not (Test-Path "$gettextBin\msgfmt.exe")) { throw "msgfmt.exe not found" }
          echo "$gettextBin" >> $env:GITHUB_PATH
          & "$gettextBin\msgfmt.exe" --version

      - name: Build o-charts probe
        shell: cmd
        working-directory: ocharts
        env:
          CONFIGURATION: RelWithDebInfo
        run: |
          call buildwin\win_deps.bat wx32
          call cache\wx-config.bat
          if not defined VCINSTALLDIR (
            for /f "tokens=* USEBACKQ" %%p in (`"%programfiles(x86)%\Microsoft Visual Studio\Installer\vswhere" -latest -property installationPath`) do call "%%p\Common7\Tools\vsDevCmd.bat"
          )
          if exist build rmdir /s /q build
          mkdir build
          cd build
          cmake -A Win32 -G "Visual Studio 17 2022" ^
            -DCMAKE_GENERATOR_PLATFORM=Win32 ^
            -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
            -DwxWidgets_LIB_DIR="%wxWidgets_LIB_DIR%" ^
            -DwxWidgets_ROOT_DIR="%wxWidgets_ROOT_DIR%" ^
            -DOCPN_TARGET_TUPLE="msvc-wx32;10;x86_64" ^
            ..
          cmake --build . --target tarball --config RelWithDebInfo

      - name: Collect package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Get-ChildItem -Path ocharts\build -Recurse -Filter "*.tar.gz" | Copy-Item -Destination artifact

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: gem-ocharts-query-probe-windows-x86
          path: artifact/*
          if-no-files-found: error
