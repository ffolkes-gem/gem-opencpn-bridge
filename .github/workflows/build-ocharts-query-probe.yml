name: Build GEM o-charts Query Probe
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout GEM probe
        uses: actions/checkout@v4
        with:
          path: gem

      - name: Checkout o-charts source
        shell: cmd
        run: |
          git clone https://github.com/deeprey-marine/deeprey-ocharts.git ocharts
          cd ocharts
          git checkout 2f54f45fb25c2d3735b639c634a6a5d68a38f451
          git submodule update --init --recursive

      - name: Apply GEM selected-object probe
        shell: powershell
        run: python gem\tools\patch_ocharts.py
        
      - name: Diagnose generated eSENCChart.cpp
        shell: powershell
        run: |
          $lines = Get-Content "ocharts\src\eSENCChart.cpp"

          Write-Host "=== Generated source lines 7600-7660 ==="
          for ($i = 7599; $i -lt 7660; $i++) {
              "{0,6}: {1}" -f ($i + 1), $lines[$i]
          }

          Write-Host "=== Generated source lines 9530-9635 ==="
          for ($i = 9529; $i -lt 9635; $i++) {
              "{0,6}: {1}" -f ($i + 1), $lines[$i]
          }
        
      - name: Diagnose GEM brace depth
        shell: powershell
        run: |
          $lines = Get-Content "ocharts\src\eSENCChart.cpp"
          $depth = 0

          for ($i = 7632; $i -lt 9619; $i++) {
              $line = $lines[$i]

              $opens  = ([regex]::Matches($line, '\{')).Count
              $closes = ([regex]::Matches($line, '\}')).Count

              $before = $depth
              $depth += $opens - $closes

              if (($opens -ne $closes) -or
                  $line -match 'routeValid|routePointCount|33C-DIAG|RESARE') {
                  "{0,6}: depth {1,3} -> {2,3} | {3}" -f `
                      ($i + 1), $before, $depth, $line
              }
          }

          Write-Host "=== Depth immediately before line 9618: $depth ==="       
      - name: Install Gettext
        shell: powershell
        run: |
          choco install gettext -y
          $gettextBin = "C:\Program Files\gettext-iconv\bin"
          if (-not (Test-Path "$gettextBin\msgfmt.exe")) { throw "msgfmt.exe not found" }
          echo "$gettextBin" >> $env:GITHUB_PATH
          & "$gettextBin\msgfmt.exe" --version

      - name: Build o-charts probe
        shell: cmd
        working-directory: ocharts
        env:
          CONFIGURATION: RelWithDebInfo
        run: |
          call buildwin\win_deps.bat wx32
          call cache\wx-config.bat
          if not defined VCINSTALLDIR (
            for /f "tokens=* USEBACKQ" %%p in (`"%programfiles(x86)%\Microsoft Visual Studio\Installer\vswhere" -latest -property installationPath`) do call "%%p\Common7\Tools\vsDevCmd.bat"
          )
          if exist build rmdir /s /q build
          mkdir build
          cd build
          cmake -A Win32 -G "Visual Studio 17 2022" ^
            -DCMAKE_GENERATOR_PLATFORM=Win32 ^
            -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
            -DwxWidgets_LIB_DIR="%wxWidgets_LIB_DIR%" ^
            -DwxWidgets_ROOT_DIR="%wxWidgets_ROOT_DIR%" ^
            -DOCPN_TARGET_TUPLE="msvc-wx32;10;x86_64" ^
            ..
          cmake --build . --target tarball --config RelWithDebInfo

      - name: Collect package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Get-ChildItem -Path ocharts\build -Recurse -Filter "*.tar.gz" | Copy-Item -Destination artifact

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: gem-ocharts-query-probe-windows-x86
          path: artifact/*
          if-no-files-found: error
