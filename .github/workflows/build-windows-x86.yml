name: Build GEM Test Windows x86

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout GEM bridge
        uses: actions/checkout@v4
        with:
          path: gem

      - name: Checkout OpenCPN plugin template
        shell: cmd
        run: git clone --recursive https://github.com/deeprey-marine/opencpn-plugin-template.git template

      - name: Overlay GEM Test files
        shell: powershell
        run: |
          Copy-Item gem\Plugin.cmake template\Plugin.cmake -Force
          Copy-Item gem\src\gemtest_pi.cpp template\src\gemtest_pi.cpp -Force
          Copy-Item gem\include\gemtest_pi.h template\include\gemtest_pi.h -Force

      - name: Build dependencies and GEM Test
        shell: cmd
        working-directory: template
        env:
          CONFIGURATION: RelWithDebInfo
        run: |
          call buildwin\win_deps.bat
          call cache\wx-config.bat

          if not defined VCINSTALLDIR (
            for /f "tokens=* USEBACKQ" %%p in (`"%programfiles(x86)%\Microsoft Visual Studio\Installer\vswhere" -latest -property installationPath`) do call "%%p\Common7\Tools\vsDevCmd.bat"
          )

          if exist build rmdir /s /q build
          mkdir build
          cd build

          cmake -A Win32 -G "Visual Studio 17 2022" ^
            -DCMAKE_GENERATOR_PLATFORM=Win32 ^
            -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
            -DwxWidgets_LIB_DIR="%wxWidgets_LIB_DIR%" ^
            -DwxWidgets_ROOT_DIR="%wxWidgets_ROOT_DIR%" ^
            -DOCPN_TARGET_TUPLE="msvc-wx32;10;x86_64" ^
            ..

          cmake --build . --target tarball --config RelWithDebInfo

      - name: Collect package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Get-ChildItem -Path template\build -Recurse -Filter "*.tar.gz" |
            Copy-Item -Destination artifact

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: gemtest-windows-x86
          path: artifact/*
          if-no-files-found: error
